# ─── Build principal (branche main uniquement) ────────────────────────────────
[build]
  command = "npm ci && npm run build"
  publish = "dist"

  # Ne builder que si des fichiers dans src/ ont changé.
  # git diff --quiet → exit 0 (pas de diff) = build annulé
  #                   exit 1 (diff détecté)  = build lancé
  ignore = "git diff --quiet $CACHED_COMMIT_REF $COMMIT_REF -- src/"

[build.environment]
  NODE_VERSION = "22"
  # npm ci utilise ~/.npm (mis en cache automatiquement par Netlify)
  # pour éviter de retélécharger les paquets à chaque build.
  NPM_FLAGS = "--prefer-offline"

# ─── Deploy previews (Pull Requests) ─────────────────────────────────────────
# exit 0 = build toujours annulé → plus aucune preview générée sur les PRs
[context.deploy-preview]
  ignore = "exit 0"

# ─── Branches non-main (branch deploys) ──────────────────────────────────────
# Désactive aussi les builds automatiques sur les branches feature/fix/etc.
[context.branch-deploy]
  ignore = "exit 0"
