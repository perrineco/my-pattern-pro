name: Tests

# Runs the same regression suite as the local pre-commit hook (see .husky/pre-commit)
# on every push and PR, so a bug like the Femmes > Pantalon crash can't reach main
# even if someone commits with --no-verify or from a machine without the hook set up.
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - run: npm install
      - run: npm run test
      - run: npm run build
